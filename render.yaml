services:
  - type: web
    name: sme-cashflow-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_BUSINESS_ID
        value: 11111111-1111-1111-1111-111111111111
